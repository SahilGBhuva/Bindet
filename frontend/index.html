<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/bindit-mascot-cutout.webp" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking font load: system fonts render first, then Inter swaps in. Instrument Serif and Caveat are only used on the landing and auth screens. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" />
    <!-- media="print" keeps the stylesheet off the critical path; /load-fonts.js switches it to "all" once it loads. It is an external file because the Content-Security-Policy (vercel.json) blocks inline event handlers. -->
    <link id="bindit-fonts" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" />
    <script src="/load-fonts.js" async></script>
    <noscript><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" /></noscript>
    <!-- viewport-fit=cover lets the phone bars reach under the notch and home bar (they pad themselves with env(safe-area-inset-*)); resizes-content shrinks the layout above the on-screen keyboard so message boxes stay in view. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- theme-init.js and lib/theme.ts keep this in step with the saved theme. -->
    <meta name="theme-color" content="#f6f5f1" />
    <!-- Applies the saved theme before first paint. Synchronous (no async/defer) so there is no flash; external because the CSP blocks inline scripts. -->
    <script src="/theme-init.js"></script>
    <meta name="description" content="bindit turns your class notes into flashcards, quizzes, and a mastery map for every course, then lets you study with friends." />
    <title>bindit — Keep your learning together</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
