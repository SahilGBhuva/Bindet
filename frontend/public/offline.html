<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>bindet is taking a short break</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light dark; --ground: #f7f5f0; --ink: #14213d; --muted: #4a5568; --card: #fff; --line: #e5e1d8; }
    @media (prefers-color-scheme: dark) { :root { --ground: #12141c; --ink: #eef1f8; --muted: #b4bccc; --card: #1b1e29; --line: #2c3142; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--ground);
           color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width: 100%; max-width: 440px; padding: 32px 28px; text-align: center; background: var(--card);
           border: 1px solid var(--line); border-radius: 16px; }
    img { width: 120px; height: auto; }
    h1 { margin: 12px 0 8px; font-size: 1.6rem; line-height: 1.2; }
    p { margin: 0; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <img src="/bindit-mascot-cutout.webp" alt="" width="120" height="144">
    <h1>bindet is taking a short break</h1>
    <p>We're making some changes and will be back soon. Your notes and flashcards are safe.</p>
  </main>
</body>
</html>
